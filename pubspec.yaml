name: shefaa
description: Medical Care App — Production Grade
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.2

  # Backend
  supabase_flutter: ^2.5.0

  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Local Cache
  hive_flutter: ^1.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.1

  # Error Handling
  dartz: ^0.10.1

  # HTTP (for Agora token fetch, etc.)
  dio: ^5.4.3

  # Notifications (Phase 4 - import now, configure later)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.4

  # Utilities
  intl: ^0.20.2
  equatable: ^2.0.5
  logger: ^2.4.0

  get_it:
  retrofit:
  flutter_hooks:
  flutter_zoom_drawer:
  flutter_localization: ^0.4.0
  pretty_dio_logger: ^1.4.0
  flutter_native_splash: ^2.4.6
  formz: ^0.6.0
  shared_preferences: ^2.3.2
  build_runner:
  retrofit_generator:
  flutter_bloc: ^9.0.0
  cached_network_image:
  json_serializable:
  freezed:
  infinite_scroll_pagination:
  internet_connection_checker:
  flutter_svg: ^2.0.17
  flutter_screenutil: ^5.9.3
  country_picker: ^2.0.27
  device_preview:
  firebase_analytics: ^11.4.4
  firebase_auth: ^5.5.1
  google_sign_in: ^6.3.0
  firebase_crashlytics: ^4.3.4
  firebase_remote_config: ^5.4.2
  package_info_plus: 8.3.0
  url_launcher:
  shimmer:
  rxdart:
  either_dart: ^1.0.0
  cubit_generator:
  readmore: ^3.0.0
  badges: ^3.0.2
  responsive_framework: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/